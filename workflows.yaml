default_lang: "en"

workflows:
  # Route 1: Simple single-step sequential approval
  simple_expense_approval:
    name:
      en: "Simple Expense Approval"
      de: "Einfache Spesenfreigabe"
    description:
      en: "Single-step approval process by direct supervisor"
      de: "Einstufiger Genehmigungsprozess durch den direkten Vorgesetzten"
    default_lang: "en"
    steps:
      - id: "team_lead_review"
        name:
          en: "Team Lead Review"
          de: "Teamleiter-Prüfung"
        type: "sequential"
        approvers:
          - "pbtc1k7ztfnxxxfejisp1fq1kc"
        on_reject: "return_to_initiator"

  # Route 2: Multi-step approval combining sequential and parallel stages
  contract_approval_multistep:
    name:
      en: "Multi-Step Contract Approval"
      de: "Mehrstufige Vertragsfreigabe"
    description:
      en: "Sequential pre-check followed by parallel Legal & Finance review and Executive sign-off"
      de: "Sequenzielle Vorprüfung gefolgt von paralleler Freigabe durch Recht & Finanzen sowie Geschäftsführung"
    default_lang: "en"
    steps:
      - id: "department_head"
        name:
          en: "Department Head"
          de: "Abteilungsleiter"
        type: "sequential"
        approvers:
          - "fjga55qpzfbeujnew873etdnde"
        on_reject: "return_to_initiator"

      - id: "legal_and_finance"
        name:
          en: "Legal & Finance Review (Parallel)"
          de: "Rechts- und Finanzprüfung (Parallel)"
        type: "parallel"
        approvers:
          - "wqpik6bewi8mzcphfwotzxnrta"
          - "xsf4wd73x7yezyuuums5fhakza"
        on_reject: "return_to_initiator"

      - id: "executive_signoff"
        name:
          en: "Executive Sign-off"
          de: "Geschäftsführung"
        type: "sequential"
        approvers:
          - "3j1quqyrifb93p6xcto9bcjwic"
        on_reject: "return_to_initiator"

# File: docker-compose.yml
# Created: 2026-11-23
# Version: 1.1.0

services:
  db:
    image: postgres:16-alpine
    container_name: mattermost-workflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-workflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow_user} -d ${POSTGRES_DB:-workflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost-local-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER:-workflow_user}:${POSTGRES_PASSWORD:-workflow_pass}@db:5432/${MATTERMOST_DB:-mattermost_db}?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:${MATTERMOST_PORT:-8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      # Pre-enable bot creation, access tokens, and internal Docker webhook callbacks
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "workflow-engine localhost 127.0.0.1 host.docker.internal"
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
    ports:
      - "${MATTERMOST_PORT:-8065}:8065"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve:/mattermost/bleve-indexes

  workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mattermost-workflow-engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Internal Docker network URLs for PostgreSQL and local Mattermost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflow_user}:${POSTGRES_PASSWORD:-workflow_pass}@db:5432/${POSTGRES_DB:-workflow_db}
      MATTERMOST_URL: http://mattermost:8065
      PUBLIC_BASE_URL: http://workflow-engine:8000
      WORKFLOWS_CONFIG_PATH: /app/workflows.yaml
      LOCALES_PATH: /app/locales.yaml
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./workflows.yaml:/app/workflows.yaml:ro
      - ./locales.yaml:/app/locales.yaml:ro
      - workflow_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  workflow_uploads:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_client_plugins:
  mattermost_bleve:

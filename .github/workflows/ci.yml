# Author: Oleh Riabtsev
# File: .github/workflows/ci.yml
# Created: 2026-11-23
# Version: 1.0.0

name: CI - Tests, Migrations & Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR (useful with automated 5-minute Git sync)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-migrations:
    name: Pytest & PostgreSQL Alembic Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow_user
          POSTGRES_PASSWORD: workflow_pass
          POSTGRES_DB: workflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workflow_user -d workflow_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://workflow_user:workflow_pass@localhost:5432/workflow_db
      MATTERMOST_URL: http://localhost:8065
      PUBLIC_BASE_URL: http://localhost:8000
      MATTERMOST_BOT_TOKEN: ci_placeholder_bot_token
      MATTERMOST_WEBHOOK_SECRET: ci_placeholder_webhook_secret
      DEFAULT_LANG: en
      CONSOLE_LANG: en

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic migrations against PostgreSQL 16
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run integration test suite with pytest
        run: pytest

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
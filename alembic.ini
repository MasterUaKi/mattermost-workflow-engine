# Author: Oleh Riabtsev
# File: alembic.ini
# Created: 2026-11-23
# Version: 1.0.0

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Prepend current working directory to sys.path so 'app' package is importable
prepend_sys_path = .

# Timezone for migration file timestamps
timezone = UTC

# Fallback database URL (overridden dynamically in alembic/env.py from .env / environment variables)
sqlalchemy.url = postgresql+asyncpg://workflow_user:workflow_pass@localhost:5432/workflow_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
